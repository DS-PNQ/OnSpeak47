apply plugin: 'com.android.application'

android {
    namespace 'com.omnivoice.onspeak47'
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.omnivoice.onspeak47"
        minSdkVersion 26
        targetSdkVersion 34
        versionCode 1
        versionName '1.0.0'

        // Only build for ARM64 (mobile target per pipeline_overview.md)
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    androidResources {
        noCompress 'onnx', 'model', 'onnx_data', 'json', 'bin', 'gguf'
    }
    // The HuggingFace download cache written by optimize/*.py is a build-time
    // byproduct (~1.2 GB of model.safetensors + tokenizer blobs) that the app
    // never reads — Java only loads the flat *.onnx/*.json/*.model files.
    // aaptOptions.ignoreAssetsPattern pattern-matches individual path segments
    // (the androidResources variant that was tried earlier did not exclude the
    // directory in practice).
    aaptOptions {
        ignoreAssetsPattern "hf_cache"
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
    lint {
        abortOnError false
    }

    // llama.cpp with the STQ kernel (llama.cpp PR #22836) — decodes the
    // Hy-MT 1.25-bit GGUF on the mobile CPU (LOW_RAM profile).
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }


    // Allow large ONNX model files in assets
}

dependencies {
    // AndroidX
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.7.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // ONNX Runtime for on-device model inference
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.22.0'
    implementation 'com.microsoft.onnxruntime:onnxruntime-extensions-android:0.13.0'

    // NOTE: the former optional onnxruntime-genai AAR (fileTree libs) was
    // removed with the HIGH_END INT4 profile — translation is single-path
    // GGUF now (see pipeline/TranslationModule.java).


    // SentencePiece tokenization: uses pure-Java SentencePieceProcessor
    // (no native JNI dependency — DJL's SpTokenizer was removed because it
    // does not ship arm64-v8a native binaries for Android)

    // Tests
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
