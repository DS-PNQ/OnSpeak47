apply plugin: 'com.android.application'

// Vendored native dependencies (sherpa-onnx AAR, see dependencies below).
repositories {
    flatDir {
        dirs 'libs'
    }
}

android {
    namespace 'com.omnivoice.onspeak47'
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.omnivoice.onspeak47"
        minSdkVersion 26
        targetSdkVersion 34
        versionCode 1
        versionName '1.0.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        // Only build for ARM64 (mobile target per pipeline_overview.md)
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    androidResources {
        noCompress 'onnx', 'model', 'onnx_data', 'json', 'bin', 'gguf'
    }
    // The HuggingFace download cache written by optimize/*.py is a build-time
    // byproduct (~1.2 GB of model.safetensors + tokenizer blobs) that the app
    // never reads — Java only loads the flat *.onnx/*.json/*.model files.
    // aaptOptions.ignoreAssetsPattern pattern-matches individual path segments
    // (the androidResources variant that was tried earlier did not exclude the
    // directory in practice).
    aaptOptions {
        ignoreAssetsPattern "hf_cache"
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
        // Both onnxruntime-android and the sherpa-onnx AAR ship their own
        // libonnxruntime.so (ours 1.27.0, sherpa's ~1.27.x) for EVERY ABI they
        // support. The ORT C API is backward compatible, so either copy loads;
        // first-wins keeps the build green. If logcat ever shows
        // UnsatisfiedLinkError in sherpa or ORT sessions, align both sides to
        // one onnxruntime-android version instead.
        pickFirst '**/libonnxruntime.so'
        // Same story for the NDK C++ runtime both AARs bundle.
        pickFirst '**/libc++_shared.so'
    }
    lint {
        abortOnError false
    }

    // llama.cpp with the STQ kernel (llama.cpp PR #22836) — decodes the
    // Hy-MT 1.25-bit GGUF on the mobile CPU (LOW_RAM profile).
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }


    sourceSets {
        androidTest.assets.srcDir '../../tests_local/data/audio_samples'
    }

    testOptions {
        unitTests.all {
            systemProperty 'onspeak.testAudio', rootProject.file('../tests_local/data/audio_samples/parity_en.wav').absolutePath
        }
    }

    // Allow large ONNX model files in assets
}

dependencies {
    // AndroidX
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.7.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // ONNX Runtime for on-device model inference (TTS + Silero VAD).
    // Version MUST stay in lockstep with the ORT core bundled inside the
    // sherpa-onnx AAR (1.27.1 for sherpa v1.13.5; 1.27.0 is the closest on
    // Maven Central). Both AARs ship libonnxruntime.so and packaging keeps
    // only one copy — a skew (e.g. 1.22.0) crashes at startup with
    // "cannot locate symbol OrtGetApiBase referenced by libsherpa-onnx-jni.so".
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.27.0'
    implementation 'com.microsoft.onnxruntime:onnxruntime-extensions-android:0.13.0'

    // Realtime multilingual ASR: streaming Zipformer VI/EN/ZH via
    // sherpa-onnx OnlineRecognizer (production path — models fetched via
    // optimize/11_fetch_streaming_zipformer.py --all --stage-assets).
    // Vendored as app/libs/sherpa-onnx-1.13.4.aar (gitignored, 46 MB — fetch
    // from https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.4/sherpa-onnx-1.13.4.aar).
    // JitPack is NOT used: it never built v1.13.4, and v1.13.5+ bundles
    // ORT 1.27.1 whose symbols match nothing on Maven Central.
    // VERSION PINNED to v1.13.4: its Android prebuilt bundles ORT 1.27.0,
    // exactly matching onnxruntime-android:1.27.0 below. Both AARs ship
    // libonnxruntime.so with ELF versioned symbols (VERS_X.Y.Z) and Android's
    // linker rejects any skew ("cannot locate symbol OrtGetApiBase").
    // DO NOT bump either side alone — see k2-fsa/sherpa-onnx#3845.
    implementation(name: 'sherpa-onnx-1.13.4', ext: 'aar')

    // NOTE: the former optional onnxruntime-genai AAR (fileTree libs) was
    // removed with the HIGH_END INT4 profile — translation is single-path
    // GGUF now (see pipeline/TranslationModule.java).


    // SentencePiece tokenization: uses pure-Java SentencePieceProcessor
    // (no native JNI dependency — DJL's SpTokenizer was removed because it
    // does not ship arm64-v8a native binaries for Android)

    // Tests
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
