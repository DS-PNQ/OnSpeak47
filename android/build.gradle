// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.3.1'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        // sherpa-onnx (streaming Zipformer ASR) is published via JitPack,
        // not Maven Central — see https://k2-fsa.github.io/sherpa/onnx/java-api/anroid-java.html
        maven { url 'https://jitpack.io' }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
